name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours (UTC)
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Visit the app and wake it if asleep
        run: python .github/scripts/keep_awake.py
        env:
          APP_URL: https://csat-copilot-dashboard.streamlit.app/
